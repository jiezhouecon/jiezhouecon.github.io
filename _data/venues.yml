# Venue badges shown beside each paper on the research page.
#
# The key is the identifier used in the `abbr` field of _data/papers.yml.
# `name`  optional label shown on the badge; the key is used when omitted.
# `color` badge background.
# `url`   optional link wrapped around the label.
#
# Course levels on the Teaching page (e.g. PhD) use the same lookup, so a key
# named after a level colours that badge; unlisted levels get a default.

"WorkingPaper":
  name: "Working Paper"
  color: "#D4E0EF"

"WorkInProgress":
  name: "Work in Progress"
  color: "#B0E0E6"

"PeerReviewed":
  name: "Peer Reviewed"
  color: "#A4C4D6"

"Conference":
  color: "#B4D9DF"
